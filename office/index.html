<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Văn phòng Alan Academy</title>
<style>
  :root { --ink:#26303f; --card:#ffffff; --accent:#2f5fb3; --line:#dde3ec; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#e4ebf3; font-family:"Segoe UI",system-ui,sans-serif; color:var(--ink); }
  canvas { display:block; }
  .bar { position:absolute; top:12px; left:12px; right:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; pointer-events:none; z-index:3; }
  .brand { background:var(--accent); color:#fff; padding:8px 14px; border-radius:12px; font-weight:700; pointer-events:auto; }
  .brand small { font-weight:400; opacity:.85; margin-left:6px; }
  .stats { display:flex; gap:8px; pointer-events:auto; flex-wrap:wrap; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px 12px; min-width:76px; text-align:center; }
  .stat b { display:block; font-size:20px; }
  .stat span { font-size:12px; opacity:.7; }
  .tool { pointer-events:auto; border:1px solid var(--line); background:#fff; color:var(--ink); font:600 13px inherit; font-family:inherit; padding:8px 12px; border-radius:12px; cursor:pointer; }
  .tool:hover { border-color:var(--accent); }
  .roster { position:absolute; top:112px; left:12px; bottom:12px; width:210px; overflow:auto; display:flex; flex-direction:column; gap:4px; padding-right:4px; z-index:2; }
  .rhead, .chip { display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-family:inherit; cursor:pointer; text-align:left; }
  .rhead { margin-top:8px; padding:6px 10px; border-radius:10px; font-weight:700; font-size:13px; }
  .chip { padding:4px 10px 4px 8px; border-radius:999px; font-size:13px; }
  .rhead:hover, .rhead.on, .chip:hover, .chip.on { border-color:var(--accent); box-shadow:0 2px 8px rgba(40,60,100,.15); }
  .rhead i, .chip i { width:12px; height:12px; border-radius:50%; flex:none; }
  .rhead .caret { width:16px; text-align:center; opacity:.7; flex:none; } .rhead small { margin-left:auto; opacity:.6; font-weight:400; } .chip.sus { opacity:.6; text-decoration:line-through; }
  .chip small { opacity:.6; margin-left:auto; font-size:11px; }
  .panel { position:absolute; top:112px; right:12px; width:min(330px, calc(100% - 24px)); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:0 8px 24px rgba(40,60,100,.18); display:none; z-index:4; }
  .panel.on { display:block; }
  .panel h3 { margin:0 0 2px; font-size:18px; padding-right:24px; }
  .panel .role { font-size:13px; opacity:.75; }
  .panel .zone { font-size:12px; opacity:.6; margin:2px 0 8px; }
  .panel .vibe { font-size:13px; font-style:italic; opacity:.8; margin:8px 0; line-height:1.4; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; color:#fff; }
  .panel .task { margin:10px 0; font-size:14px; line-height:1.4; }
  .panel ul { margin:0; padding:0; list-style:none; max-height:160px; overflow:auto; font-size:13px; }
  .panel li { padding:5px 0; border-top:1px dashed var(--line); }
  .panel #close { position:absolute; top:10px; right:10px; border:0; background:none; font-size:18px; cursor:pointer; color:var(--ink); }
  .panel .btn { display:inline-block; margin-top:10px; font-size:13px; padding:6px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; cursor:pointer; font-family:inherit; }
  .hint { position:absolute; left:232px; bottom:12px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:12px; padding:6px 12px; font-size:12px; max-width:min(380px, calc(100% - 250px)); line-height:1.45; }
  .hint code { background:#eef2f8; padding:1px 5px; border-radius:5px; }
  #bubbles { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:2; }
  .bub { position:absolute; transform:translate(-50%,-100%); background:#fffdf4; color:#26303f; border:2px solid #26303f; border-radius:12px; padding:5px 10px 7px; max-width:230px; min-width:70px; font-size:13px; line-height:1.4; box-shadow:0 3px 0 rgba(38,48,63,.25); margin-top:-10px; }
  .bub::after { content:''; position:absolute; left:50%; bottom:-9px; margin-left:-7px; border:7px solid transparent; border-top-color:#26303f; border-bottom:0; }
  .bub::before { content:''; position:absolute; left:50%; bottom:-6px; margin-left:-5px; border:5px solid transparent; border-top-color:#fffdf4; border-bottom:0; z-index:1; }
  .bub b { display:inline-block; color:#fff; font-size:11px; padding:0 7px; border-radius:6px; margin-bottom:2px; margin-right:6px; text-shadow:0 1px 0 rgba(0,0,0,.25); }
  #meetBar { display:none; position:absolute; left:50%; bottom:12px; transform:translateX(-50%); width:min(460px, calc(100% - 480px)); background:rgba(255,255,255,.96); border:1px solid var(--line); border-radius:14px; padding:8px 12px; font-size:12.5px; line-height:1.45; box-shadow:0 6px 18px rgba(40,60,100,.18); z-index:3; }
  #meetBar h4 { margin:0 0 4px; font-size:13px; } #meetBar small { opacity:.6; font-weight:400; }
  .tools { display:flex; gap:6px; align-items:center; flex-wrap:wrap; pointer-events:auto; flex-basis:100%; }
  .tool.demo { background:#2f7fd1; color:#fff; border-color:#2f7fd1; } .tool.demo.on { background:#b0413e; border-color:#b0413e; }
  .tool.ck { display:flex; align-items:center; gap:4px; font-weight:400; } .bdg { background:#d33; color:#fff; border-radius:999px; font-size:11px; padding:0 6px; margin-left:3px; }
  .bst { font-size:11px; padding:3px 8px; border-radius:999px; background:#fff; border:1px solid var(--line); pointer-events:auto; } .bst.ok { color:#2b7a4b; } .bst.warn { color:#a86a00; } .bst.bad { color:#b0413e; }
  #demoNote { display:none; position:absolute; top:60px; left:50%; transform:translateX(-50%); background:rgba(47,127,209,.93); color:#fff; padding:5px 14px; border-radius:999px; font-size:12px; pointer-events:none; z-index:5; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:#26303f; color:#fff; padding:9px 16px; border-radius:12px; font-size:13px; opacity:0; transition:.3s; z-index:60; max-width:80vw; } .toast.on { opacity:1; transform:translate(-50%,0); } .toast.err { background:#b0413e; }
  .modal { position:fixed; inset:0; background:rgba(30,40,60,.45); display:flex; align-items:center; justify-content:center; z-index:30; padding:12px; }
  .mbox { background:#fff; border-radius:16px; padding:0 16px 16px; width:min(620px,100%); max-height:92vh; overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,.35); } .mbox.wide { width:min(900px,100%); } .mbox.xl { width:min(1180px,100%); }
  .mhead { display:flex; align-items:center; position:sticky; top:0; background:#fff; padding:12px 0 6px; z-index:2; } .mhead h3 { margin:0; flex:1; font-size:17px; } .mx { border:0; background:none; font-size:22px; cursor:pointer; color:var(--ink); }
  .tabs { display:flex; gap:6px; margin-bottom:10px; } .tab { border:1px solid var(--line); background:#fff; padding:6px 14px; border-radius:10px; cursor:pointer; font-family:inherit; } .tab.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .row-line { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; } .row-line input, .row-line select, .row-line textarea { font:inherit; font-size:13px; border:1px solid var(--line); border-radius:8px; padding:5px 8px; } .row-line input:not([type]), .row-line input[type=text], .row-line textarea { flex:1; min-width:120px; }
  .dot { width:14px; height:14px; border-radius:50%; flex:none; } .dim { font-size:12px; opacity:.65; } .note { font-size:12px; opacity:.8; margin:8px 0; line-height:1.5; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .grid2 label, .tcol label { display:flex; flex-direction:column; gap:3px; font-size:12px; font-weight:600; } .grid2 .wide { grid-column:1/-1; }
  .grid2 input:not([type=checkbox]), .grid2 select, .grid2 textarea, .tcol textarea, .tcol select, .tcol input:not([type=checkbox]) { font:inherit; font-size:13px; font-weight:400; border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:#fff; width:100%; }
  .grid2 input[type=color] { padding:2px; height:34px; } .ck { flex-direction:row !important; align-items:center; gap:6px; font-weight:400 !important; }
  .chk { display:flex; flex-wrap:wrap; gap:4px 12px; font-weight:400; } .chk label { flex-direction:row !important; font-weight:400 !important; align-items:center; } .chk.col { flex-direction:column; }
  .mrow { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:12px; flex-wrap:wrap; }
  .btn2, .btn3 { border-radius:10px; padding:8px 16px; cursor:pointer; font:inherit; font-weight:600; font-size:13px; } .btn2 { border:1px solid var(--line); background:#fff; color:var(--ink); } .btn3 { border:0; background:#3da36a; color:#fff; } .sm { padding:4px 10px !important; font-size:12px !important; }
  .mailcard { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:8px 0; } .mailcard.new, .mailcard.pending { border-color:#2f5fb3; background:#f6f9ff; } .mailcard.off { opacity:.6; }
  .mailhead { display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .mailbody { font-size:13px; line-height:1.5; margin:6px 0; max-height:220px; overflow:auto; white-space:pre-wrap; }
  .badge2 { font-size:11px; padding:1px 8px; border-radius:999px; background:#e8eef9; color:#2f5fb3; } .badge2.pending { background:#fff0cf; color:#a86a00; } .badge2.seen { background:#eef0f3; color:#555; } .badge2.approved { background:#dff2e3; color:#2b7a4b; }
  .files { font-size:12px; margin:4px 0; } .link { border:0; background:none; color:var(--accent); text-decoration:underline; cursor:pointer; font:inherit; font-size:12px; padding:0 6px 0 0; }
  pre, .filev { background:#1f2733; color:#e8eef9; padding:8px 10px; border-radius:8px; overflow:auto; font-size:12px; white-space:pre-wrap; max-height:340px; }
  .switch input { width:34px; height:18px; }
  .split { display:grid; grid-template-columns:1fr 1fr; gap:16px; } .tcol h4 { margin:8px 0 4px; } .tchat { border:1px solid var(--line); border-radius:12px; height:340px; overflow:auto; padding:8px; display:flex; flex-direction:column; gap:7px; background:#fafbfd; }
  .chat { position:absolute; right:12px; bottom:12px; width:min(400px, calc(100% - 24px)); max-height:52vh; display:flex; flex-direction:column; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 24px rgba(40,60,100,.22); overflow:hidden; font-size:13px; z-index:12; }
  .chat.min .chat-b, .chat.min .chat-o, .chat.min .chat-i { display:none; } .chat-h { display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--line); background:#f1f5fb; } .cs { flex:1; font-size:11px; opacity:.7; text-align:right; }
  .chat.busy .chat-h b::after { content:' ⏳'; } .mini { border:1px solid var(--line); background:#fff; border-radius:8px; padding:2px 8px; cursor:pointer; font:inherit; font-size:12px; color:var(--ink); }
  .chat-b { flex:1; overflow:auto; padding:10px; display:flex; flex-direction:column; gap:7px; min-height:140px; }
  .msg { padding:7px 10px; border-radius:10px; line-height:1.45; word-break:break-word; } .msg.user { align-self:flex-end; background:var(--accent); color:#fff; max-width:88%; } .msg.bot { background:#fff; border:1px solid var(--line); }
  .msg .who { font-size:11px; font-weight:700; color:var(--accent); margin-bottom:2px; } .msg h4 { margin:8px 0 2px; font-size:13px; } .msg .gap { height:4px; }
  .msg.sys { background:#eef2f8; font-size:12px; } .msg.err { background:#fde0dd; } .msg.ok { background:#dff2e3; } .msg.card { background:#fff8e6; border:1px dashed #d9a441; } .cardtitle { font-weight:700; margin-bottom:6px; }
  .msg code, .mailbody code, .note code { background:#eef2f8; padding:0 4px; border-radius:4px; font-size:12px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; } .row button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:4px 10px; cursor:pointer; font:inherit; font-size:12px; color:var(--ink); } .row button.ok { background:#3da36a; color:#fff; border-color:#3da36a; } .row button:disabled { opacity:.45; }
  .chat-o { display:flex; flex-wrap:wrap; gap:4px 10px; padding:6px 10px; border-top:1px solid var(--line); font-size:12px; } .chat-o select { font:inherit; font-size:12px; max-width:200px; }
  .chat-i { display:flex; gap:6px; padding:8px 10px 10px; border-top:1px solid var(--line); } .chat-i textarea { flex:1; resize:none; font:inherit; font-size:13px; border:1px solid var(--line); border-radius:8px; padding:6px 8px; } .chat-i button { border:0; background:var(--accent); color:#fff; border-radius:10px; padding:0 16px; font-weight:600; cursor:pointer; } .chat-i button:disabled { opacity:.5; }
  .chips { display:inline-flex; flex-wrap:wrap; gap:4px; } .chip2 { background:#eef2f8; border:1px solid var(--line); border-radius:999px; font-size:11px; padding:1px 8px; } .chip2.x { cursor:pointer; margin:1px 2px 1px 0; display:inline-block; } .chip2.x:hover { background:#fde0dd; } { .split, .grid2 { grid-template-columns:1fr; } }
  .chips { display:inline-flex; flex-wrap:wrap; gap:4px; } .chip2 { background:#eef2f8; border:1px solid var(--line); border-radius:999px; font-size:11px; padding:1px 8px; } .chip2.x { cursor:pointer; margin:1px 2px 1px 0; display:inline-block; } .chip2.x:hover { background:#fde0dd; }
  table.mx { border-collapse:collapse; font-size:12px; width:100%; } table.mx th, table.mx td { border:1px solid var(--line); padding:4px 6px; vertical-align:top; text-align:left; } table.mx th { background:#f1f5fb; position:sticky; top:0; } table.mx td.c { text-align:center; } table.mx select { font-size:11px; max-width:120px; }
  .hrroom { border:1px solid var(--line); border-radius:12px; margin:8px 0; padding:6px 8px; } .hrhead { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .hrrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:5px 6px 5px 26px; border-top:1px dashed var(--line); } .hrrow.sus { opacity:.65; } .acts { margin-left:auto; display:flex; gap:4px; flex-wrap:wrap; } .caretb { border:0; background:none; cursor:pointer; font-size:14px; width:22px; color:var(--ink); }
  .btn2.danger { color:#b0413e; border-color:#e8b9b5; } .btn3.danger { background:#b0413e; } .planrow { padding:3px 0; font-size:13px; } .planrow.danger { color:#8a2a24; } .planrow label { display:flex; gap:6px; align-items:flex-start; }
  .kvs { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:6px; margin:8px 0; } .kv { background:#f6f8fc; border-radius:8px; padding:6px 8px; display:flex; flex-direction:column; font-size:13px; } .tl .tlrow { display:flex; gap:10px; padding:3px 0; border-top:1px dashed var(--line); font-size:12.5px; }
  #connBanner { display:none; position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:70; background:#b0413e; color:#fff; padding:8px 14px; border-radius:12px; font-size:13px; box-shadow:0 6px 18px rgba(0,0,0,.25); } .convinfo { font-size:11.5px; padding:4px 10px; color:#55606f; border-top:1px solid var(--line); } .convinfo:empty { display:none; } .convinfo a { color:var(--accent); }
  @media (max-width:900px) { .split, .grid2 { grid-template-columns:1fr; } }
  @media (max-width:700px) { .roster { width:auto; right:12px; top:auto; bottom:12px; max-height:34vh; } .hint { display:none; } }
</style>
</head>
<body>
<div class="bar">
  <div class="brand">Văn phòng Alan Academy <small>AI Agent</small></div>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <button class="tool" id="home">🏙️ Toàn cảnh</button>
    <button class="tool" id="btnChat">💬 Giao việc</button>
    <button class="tool" id="btnMeet">🗣️ Họp</button>
    <button class="tool" id="btnOrg">🏢 Cơ cấu & Nhân sự</button>
    <button class="tool" id="btnCaps">🧩 Năng lực</button>
    <button class="tool" id="btnSched">📅 Lịch</button>
    <button class="tool" id="btnInbox">📥 Hộp thư <span id="inboxBadge" class="bdg" style="display:none">0</span></button>
    <button class="tool demo" id="btnDemo">▶ Chạy demo</button>
    <select id="demoSpeed" class="tool" title="Tốc độ demo"><option value="1">×1</option><option value="2">×2</option><option value="4">×4</option></select>
    <label class="tool ck" title="Lặp lại demo"><input type="checkbox" id="demoLoop"> lặp</label>
    <select id="engineSel" class="tool" title="Engine cho việc giao từ giao diện"><option value="mock">Chạy thử (không tốn token)</option><option value="claude:haiku">Claude thật · nhẹ (haiku, rẻ nhất)</option><option value="claude:sonnet">Claude thật · sonnet</option><option value="claude">Claude thật · model mặc định của gói</option></select>
    <span id="bridgeSt" class="bst"></span>
  </div>
</div>
<div class="roster" id="roster"></div>
<div id="bubbles"></div>
<div id="demoNote">Chế độ demo: kịch bản chạy ngay trên trình duyệt, không gọi Claude, không tốn token.</div>
<div id="meetBar"></div>
<div class="panel" id="panel">
  <button id="close" aria-label="Đóng">×</button>
  <h3 id="p-name"></h3>
  <div class="role" id="p-role"></div>
  <div class="zone" id="p-zone"></div>
  <span class="badge" id="p-status"></span>
  <div class="task" id="p-task"></div>
  <div class="vibe" id="p-vibe"></div>
  <ul id="p-log"></ul>
  <button class="btn" id="p-edit">✏️ Chỉnh setup</button> <button class="btn" id="p-chat">💬 Chat thử</button> <button class="btn" id="p-hr">🧑‍💼 Hồ sơ HR</button>
</div>
<div class="hint">Kéo để xoay, cuộn để zoom, bấm nhân vật hoặc tên bên trái để bay tới. Trạng thái đọc từ <code>office/state/*.js</code>, cập nhật mỗi 3 giây.</div>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script>
  fetch('org.json', { cache:'no-store' }).then(r => r.json()).then(org => {
    window.ORG = org;
    return ['world.js', 'nav.js', 'actors.js', 'ui.js', 'chat.js', 'trainer.js', 'caps.js', 'hr.js', 'demo.js'].reduce((p, f) => p.then(() => new Promise((ok, bad) => {
      const s = document.createElement('script'); s.src = f + '?t=' + Date.now(); s.onload = ok; s.onerror = () => bad(new Error('Không nạp được ' + f)); document.body.appendChild(s);
    })), Promise.resolve());
  }).catch(e => { document.body.insertAdjacentHTML('beforeend', '<div style="position:absolute;top:80px;left:240px;background:#fde0dd;padding:10px 14px;border-radius:10px">Lỗi: ' + e.message + '. Hãy mở qua http://localhost:8766/ bằng chay-van-phong.bat.</div>'); });
</script>
</body>
</html>
